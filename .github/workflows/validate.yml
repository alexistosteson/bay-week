name: validate

on:
  push:
    paths: ['data/**', 'config/**', 'scripts/**', 'schema/**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: Validate event data
        run: python3 scripts/validate.py
      - name: Check brief.yml parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('config/brief.yml')); yaml.safe_load(open('config/sources.yml')); print('config ok')"
      - name: Check docs/events.json is current
        run: |
          python3 scripts/build.py
          git diff --exit-code docs/events.json || (echo "::error::docs/events.json is stale — run scripts/build.py and commit" && exit 1)
